<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor - House Mix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/monitor/style.css?v=3" />
</head>
<body>
  <!-- ===================== LOGIN ===================== -->
  <section id="tela-login" class="tela ativa">
    <div class="login-box">
      <div class="parafuso p-tl"></div><div class="parafuso p-tr"></div>
      <div class="parafuso p-bl"></div><div class="parafuso p-br"></div>
      <span class="login-eyebrow">MONITOR MIX · HOUSE</span>
      <h1>House Mix</h1>
      <p class="subtitulo">Tela de mensagens dos músicos</p>
      <label class="campo">
        <span>SENHA</span>
        <input id="inp-senha" type="password" placeholder="senha" autocomplete="off" />
      </label>
      <button id="btn-entrar" class="btn-primario">ENTRAR</button>
      <p id="login-erro" class="erro"></p>
    </div>
  </section>

  <!-- ===================== MONITOR ===================== -->
  <section id="tela-monitor" class="tela">
    <div class="console">
      <div class="parafuso p-tl"></div><div class="parafuso p-tr"></div>
      <div class="parafuso p-bl"></div><div class="parafuso p-br"></div>

      <header class="topo">
        <div class="topo-titulo">
          <span class="eyebrow">MONITOR MIX · HOUSE</span>
          <strong>House Mix</strong>
        </div>
        <div class="presenca">
          <span class="presenca-label">ONLINE</span>
          <div id="lista-presenca" class="lista-presenca"><span class="ninguem">ninguém</span></div>
        </div>
        <button id="btn-limpar" class="btn-limpar">LIMPAR</button>
      </header>

      <div id="chat-digitando" class="chat-digitando" role="status" aria-live="polite" aria-atomic="true"></div>
      <main id="mensagens" class="mensagens">
        <div class="vazio">Aguardando mensagens dos músicos…</div>
      </main>

      <footer class="resposta">
        <input id="resp-input" type="text" placeholder="Responder a todos (opcional)…" maxlength="300" />
        <button id="resp-enviar" class="btn-enviar">RESPONDER</button>
      </footer>
    </div>
  </section>

  <script src="/shared/chat-digitando.js?v=1"></script>
  <script src="/monitor/app.js?v=2"></script>
</body>
</html>
